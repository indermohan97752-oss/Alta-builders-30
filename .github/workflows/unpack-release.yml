name: Expand deployment source
on:
  push:
    branches: [main]
    paths:
      - deploy-source.tar.gz
      - .github/workflows/unpack-release.yml
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract frontend and backend
        run: |
          tar -xzf deploy-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend
          if ! git diff --cached --quiet; then
            git commit -m "Add corrected frontend and backend deployment source"
            git push
          fi
